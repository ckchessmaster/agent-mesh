issuer: http://localhost:8085/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db
web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - 'http://localhost:3000'
    - 'http://127.0.0.1:3000'
    - '*'
telemetry:
  http: 0.0.0.0:5558
enablePasswordDB: true

oauth2:
  skipApprovalScreen: true

expiry:
  deviceRequests: "5m"
  signingKeys: "720h"
  idTokens: "24h"
  authCodes: "10m"

staticClients:
  - id: agentmesh-dashboard
    redirectURIs:
      - 'http://localhost:3000/auth/callback'
      - 'http://127.0.0.1:3000/auth/callback'
      - 'http://192.168.20.159:3000/auth/callback'
    name: 'AgentMesh Dashboard'
    public: true

