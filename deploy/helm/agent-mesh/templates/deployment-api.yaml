apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      {{- $metrics := .Values.api.metrics | default dict }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
            {{- if $metrics.enabled }}
            # Scraped straight off the pod IP by the PodMonitor. The Service does not publish
            # this port, which is what keeps the unauthenticated scrape endpoint off the
            # Ingress path.
            - containerPort: {{ $metrics.port }}
              name: metrics
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.config.secretName | default "agent-mesh-secrets" }}
          {{- if or $metrics.enabled .Values.api.env }}
          env:
            {{- if $metrics.enabled }}
            # Kestrel takes every listener from this one variable, so the scrape port is added
            # here instead of in code: binding a listener in code makes Kestrel throw this list
            # away wholesale, which silently kills the application's own port.
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.port }};http://+:{{ $metrics.port }}"
            - name: Metrics__Prometheus__Enabled
              value: "true"
            - name: Metrics__Prometheus__Port
              value: {{ $metrics.port | quote }}
            {{- end }}
            {{- with .Values.api.env }}
            # Rendered after envFrom on purpose: plain `env` entries win over the ConfigMap, so
            # these stay overridable per-release without forking the chart.
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            # The default 1s was too tight under GC pauses/CPU throttling: the probe recorded
            # "context deadline exceeded" and pulled a healthy pod out of rotation while it was
            # only slow, not dead.
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
