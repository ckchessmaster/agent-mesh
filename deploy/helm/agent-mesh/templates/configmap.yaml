apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  Temporal__Host: {{ .Values.config.temporalHost | quote }}
  Temporal__Namespace: {{ .Values.config.temporalNamespace | default "default" | quote }}
{{- $sUrl := .Values.config.storage.serviceUrl }}
{{- $bName := .Values.config.storage.bucketName }}
{{- $tBytes := .Values.config.storage.thresholdBytes }}
{{- if kindIs "map" .Values.config.storage.serviceUrl }}
  {{- $sUrl = .Values.config.storage.serviceUrl.serviceUrl }}
  {{- $bName = .Values.config.storage.serviceUrl.bucketName | default .Values.config.storage.bucketName }}
  {{- $tBytes = .Values.config.storage.serviceUrl.thresholdBytes | default .Values.config.storage.thresholdBytes }}
{{- end }}
  Storage__S3__ServiceUrl: {{ $sUrl | quote }}
  Storage__S3__BucketName: {{ $bName | quote }}
  Storage__S3__ThresholdBytes: {{ $tBytes | quote }}
  Oidc__Authority: {{ if .Values.config.oidc.authority }}{{ .Values.config.oidc.authority | quote }}{{ else if .Values.dex.enabled }}"https://{{ .Values.ingress.host }}/dex"{{ else }}"http://localhost:8085/dex"{{ end }}
  Oidc__ClientId: {{ .Values.config.oidc.clientId | quote }}
  Oidc__RequireHttpsMetadata: {{ .Values.config.oidc.requireHttpsMetadata | quote }}
  PersonaContainer__Runtime: "kubernetes"
  PersonaContainer__Image: "{{ .Values.config.personaRunner.image.repository }}:{{ .Values.config.personaRunner.image.tag | default .Chart.AppVersion }}"
  PersonaContainer__PullPolicy: {{ .Values.config.personaRunner.image.pullPolicy | default "IfNotPresent" | quote }}
{{- if .Values.config.personaRunner.imagePullSecret }}
  PersonaContainer__ImagePullSecret: {{ .Values.config.personaRunner.imagePullSecret | quote }}
{{- end }}
  PersonaContainer__IdleTimeoutMinutes: {{ .Values.config.personaRunner.idleTimeoutMinutes | quote }}
  PersonaContainer__WorkspaceSize: {{ .Values.config.personaRunner.storage.size | default "10Gi" | quote }}
{{- if .Values.config.personaRunner.storage.storageClassName }}
  PersonaContainer__StorageClassName: {{ .Values.config.personaRunner.storage.storageClassName | quote }}
{{- end }}
  Kubernetes__ApiUrl: "http://{{ .Release.Name }}-api:{{ .Values.api.port | default 5000 }}"
  Kubernetes__ConfigMapName: "{{ .Release.Name }}-config"
  Kubernetes__SecretName: {{ .Values.config.secretName | default "agent-mesh-secrets" | quote }}
  Kubernetes__Namespace: {{ .Release.Namespace | quote }}
