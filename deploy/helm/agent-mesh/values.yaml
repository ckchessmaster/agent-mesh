# Default values for agent-mesh.
replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  host: "agents.yourdomain.local"
  clusterIssuer: "letsencrypt-prod"
  tlsSecretName: "agent-mesh-tls"

api:
  image:
    repository: "ghcr.io/your-org/agent-mesh-api"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  port: 5000
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

worker:
  image:
    repository: "ghcr.io/your-org/agent-mesh-worker"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

dashboard:
  replicas: 1
  image:
    repository: "ghcr.io/your-org/agent-mesh-dashboard"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

config:
  # Name of the pre-created Kubernetes Secret containing sensitive credentials
  # (Auth__StaticApiKey, ConnectionStrings__agentdb, ConnectionStrings__redis, Storage__S3__AccessKey, Storage__S3__SecretKey)
  secretName: "agent-mesh-secrets"
  temporalHost: "temporal:7233"
  temporalNamespace: "default"
  storage:
    serviceUrl: "http://seaweedfs:8333"
    bucketName: "agent-mesh-artifacts"
    thresholdBytes: 65536
  personaRunner:
    image:
      repository: "ghcr.io/your-org/agentmesh-persona-runner"
      tag: "0.2.0"
      pullPolicy: IfNotPresent
    idleTimeoutMinutes: 30
