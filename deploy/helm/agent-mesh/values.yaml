# Default values for agent-mesh.
replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  host: "agents.yourdomain.local"
  clusterIssuer: "letsencrypt-prod"
  tlsSecretName: "agent-mesh-tls"

api:
  image:
    repository: "ghcr.io/your-org/agent-mesh-api"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  port: 5000
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

worker:
  image:
    repository: "ghcr.io/your-org/agent-mesh-worker"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

dashboard:
  replicas: 1
  image:
    repository: "ghcr.io/your-org/agent-mesh-dashboard"
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

config:
  # Name of the pre-created Kubernetes Secret containing sensitive credentials
  # (Auth__StaticApiKey, ConnectionStrings__agentdb, ConnectionStrings__redis, Storage__S3__AccessKey, Storage__S3__SecretKey)
  secretName: "agent-mesh-secrets"
  temporalHost: "temporal:7233"
  temporalNamespace: "default"
  storage:
    serviceUrl: "http://seaweedfs:8333"
    bucketName: "agent-mesh-artifacts"
    thresholdBytes: 65536
  oidc:
    # URL of your OpenID Connect identity provider (e.g. Keycloak, Okta, Authentik, Azure AD / Entra ID, or Dex)
    # If dex.enabled is true and authority is left blank, it automatically defaults to: https://<ingress.host>/dex
    authority: ""
    # OIDC Client ID configured in the IdP for the Dashboard (public PKCE client)
    clientId: "agentmesh-dashboard"
    # Enforce HTTPS metadata validation (set to true in production)
    requireHttpsMetadata: true
  personaRunner:
    image:
      repository: "ghcr.io/your-org/agent-mesh-persona-runner"
      tag: "0.2.0"
      pullPolicy: IfNotPresent
    # Name of an existing kubernetes.io/dockerconfigjson secret if the image is in a private registry
    imagePullSecret: ""
    idleTimeoutMinutes: 30

# Optional: In-cluster Dex OIDC Provider (turn on if you don't have an external corporate IdP)
dex:
  enabled: false
  image:
    repository: "ghcr.io/dexidp/dex"
    tag: "v2.41.1"
    pullPolicy: IfNotPresent
  adminEmail: "admin@agentmesh.local"
  # Default bcrypt hash for "password" - MUST be changed for production!
  adminPasswordHash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
