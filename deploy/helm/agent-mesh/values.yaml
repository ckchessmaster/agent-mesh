# Default values for agent-mesh.
replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  host: "agents.yourdomain.local"
  clusterIssuer: "letsencrypt-prod"
  tlsSecretName: "agent-mesh-tls"

api:
  image:
    repository: "ghcr.io/ckchessmaster/agent-mesh-api"
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  port: 5000
  resources:
    limits:
      cpu: 1000m
      # Measured in prod (2026-11-17): the API's working-set floor is ~230Mi and
      # GC-driven spikes reach 470-510Mi, so the old 512Mi ceiling was hit several
      # times a day and the container was OOMKilled (exit 137). The extra headroom
      # also has to cover ~150Mi of mapped-image + shared memory the process carries
      # alongside the managed heap.
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  # Runtime knobs injected into the API container. DOTNET_GCHeapHardLimit caps the
  # managed heap so the GC collects *before* the container limit instead of growing
  # into it - without a cap, server GC scales its target to whatever the cgroup
  # allows and simply OOMs later at a bigger ceiling.
  # Value is hexadecimal bytes: 0x28000000 = 640Mi. Keep it comfortably below
  # api.resources.limits.memory.
  env:
    DOTNET_GCHeapHardLimit: "0x28000000"
  # Prometheus scrape endpoint, implemented in src/AgentMesh.ServiceDefaults/Extensions.cs.
  # It is served on its own container port which the Service deliberately does not publish, so
  # the unauthenticated endpoint stays inside the pod network where the scraper lives and can
  # never be reached through the Ingress.
  metrics:
    enabled: true
    port: 9464
    # A PodMonitor is only created when the cluster actually has the prometheus-operator CRDs,
    # so leaving this on is harmless on a bare cluster.
    podMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      # Merged onto the PodMonitor, for operators that restrict selection by label.
      labels: {}

worker:
  image:
    repository: "ghcr.io/ckchessmaster/agent-mesh-worker"
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

dashboard:
  replicas: 1
  image:
    repository: "ghcr.io/ckchessmaster/agent-mesh-dashboard"
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

config:
  # Name of the pre-created Kubernetes Secret containing sensitive credentials
  # (Auth__StaticApiKey, ConnectionStrings__agentdb, ConnectionStrings__redis, Storage__S3__AccessKey, Storage__S3__SecretKey)
  secretName: "agent-mesh-secrets"
  temporalHost: "temporal:7233"
  temporalNamespace: "default"
  storage:
    serviceUrl: "http://seaweedfs:8333"
    bucketName: "agent-mesh-artifacts"
    thresholdBytes: 65536
  oidc:
    # URL of your OpenID Connect identity provider (e.g. Keycloak, Okta, Authentik, Azure AD / Entra ID, or Dex)
    # If dex.enabled is true and authority is left blank, it automatically defaults to: https://<ingress.host>/dex
    authority: ""
    # OIDC Client ID configured in the IdP for the Dashboard (public PKCE client)
    clientId: "agentmesh-dashboard"
    # Enforce HTTPS metadata validation (set to true in production)
    requireHttpsMetadata: true
  personaRunner:
    image:
      repository: "ghcr.io/ckchessmaster/agent-mesh-persona-runner"
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    # Name of an existing kubernetes.io/dockerconfigjson secret if the image is in a private registry
    imagePullSecret: ""
    idleTimeoutMinutes: 30
    # Automatically restart and update persona runner containers to the latest configured image when idle
    autoUpdateIdleRunners: true
    storage:
      size: "10Gi"
      storageClassName: ""

# Optional: In-cluster Dex OIDC Provider (turn on if you don't have an external corporate IdP)
dex:
  enabled: false
  image:
    repository: "ghcr.io/dexidp/dex"
    tag: "v2.41.1"
    pullPolicy: IfNotPresent
  adminEmail: "admin@agentmesh.local"
  # Default bcrypt hash for "password" - MUST be changed for production!
  adminPasswordHash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
