# Example Kubernetes Secret for AgentMesh
# Apply this secret BEFORE running 'helm install / helm upgrade':
# kubectl apply -f secrets.yaml -n <your-namespace>
apiVersion: v1
kind: Secret
metadata:
  name: agent-mesh-secrets
  labels:
    app.kubernetes.io/name: agent-mesh
type: Opaque
stringData:
  # Control Plane Master API Token
  Auth__StaticApiKey: "replace-with-a-secure-random-master-token"

  # PostgreSQL Connection String
  ConnectionStrings__agentdb: "Host=postgres;Port=5432;Database=agentdb;Username=postgres;Password=your-postgres-password"

  # Redis Connection String
  ConnectionStrings__redis: "redis:6379"

  # S3 / Object Storage Credentials
  Storage__S3__AccessKey: "agentmesh-storage-key"
  Storage__S3__SecretKey: "AgentMesh#SecureS3Pass2026!"

  # Optional LLM Provider API Keys & Git Token (Injected into Persona Container Environments)
  OPENAI_API_KEY: "sk-..."
  ANTHROPIC_API_KEY: "sk-ant-..."
  GEMINI_API_KEY: "AIzaSy..."
  GITHUB_TOKEN: "ghp_..."
