name: AgentMesh Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write
  packages: write

jobs:
  publish-containers-and-helm:
    name: Build & Push Container Images & Helm Chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "TAG=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          # Convert repository owner to lowercase for Docker / GHCR naming compliance
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. API Image
      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-api:latest

      # 2. Worker Image
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-worker:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-worker:latest

      # 3. Dashboard Image
      - name: Build & Push Dashboard Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-dashboard:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-dashboard:latest

      # 4. Persona Runner Image
      - name: Build & Push Persona Runner Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.persona
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-persona-runner:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.OWNER_LC }}/agent-mesh-persona-runner:latest

      # Helm Chart OCI Packaging & Push
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package & Push Helm Chart to GHCR OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          mkdir -p /tmp/chart-pkg
          helm package deploy/helm/agent-mesh \
            --version "${{ steps.version.outputs.VERSION }}" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            -d /tmp/chart-pkg
          helm push /tmp/chart-pkg/agent-mesh-${{ steps.version.outputs.VERSION }}.tgz "oci://ghcr.io/${{ steps.version.outputs.OWNER_LC }}/charts"

  publish-cli-and-release:
    name: Build Cross-Platform CLI Binaries & Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-containers-and-helm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "TAG=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Cross-Platform CLI Binaries
        run: |
          chmod +x ./scripts/build-cli.sh
          ./scripts/build-cli.sh

      - name: Package Release Binaries and Checksums
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          mkdir -p dist/release

          # Archive binaries for distribution
          tar -czvf "dist/release/agentmesh-${TAG}-linux-x64.tar.gz" -C dist/cli/linux-x64 agentmesh
          tar -czvf "dist/release/agentmesh-${TAG}-macos-arm64.tar.gz" -C dist/cli/osx-arm64 agentmesh
          tar -czvf "dist/release/agentmesh-${TAG}-macos-x64.tar.gz" -C dist/cli/osx-x64 agentmesh

          # Also package zip for Windows
          sudo apt-get update && sudo apt-get install -y zip
          (cd dist/cli/win-x64 && zip -9 "${GITHUB_WORKSPACE}/dist/release/agentmesh-${TAG}-windows-x64.zip" agentmesh.exe)

          # Generate SHA256 checksums
          cd dist/release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          gh release create "$TAG" dist/release/* \
            --title "AgentMesh ${TAG}" \
            --generate-notes
